<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Weight Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --surface: #0c0f1a;
            --surface-2: #12162a;
            --surface-3: #1a1f3a;
            --border: rgba(255,255,255,.07);
            --text: #f0f2f7;
            --text-muted: #6b7280;
            --morning: #fbbf24;
            --night: #a78bfa;
            --accent: #22d3ee;
            --danger: #f87171;
            --success: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 100px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(34,211,238,.05), transparent),
                        radial-gradient(ellipse 50% 30% at 80% 100%, rgba(167,139,250,.04), transparent);
            pointer-events: none;
            z-index: 0;
        }
        .app { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; padding: 0 16px; }
        header { padding: 28px 0 20px; text-align: center; }
        header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -.03em;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { color: var(--text-muted); margin-top: 4px; font-size: .9rem; }

        .stats-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 0 16px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
        }
        .stats-scroll::-webkit-scrollbar { display: none; }
        .stat-card {
            flex: 0 0 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 14px;
            text-align: center;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2.5px;
        }
        .stat-card.morning::before { background: var(--morning); }
        .stat-card.night::before { background: var(--night); }
        .stat-card.diff::before { background: var(--accent); }
        .stat-card.count::before { background: var(--success); }
        .stat-card .label {
            font-size: .65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
        .stat-card.morning .value { color: var(--morning); }
        .stat-card.night .value { color: var(--night); }
        .stat-card.diff .value { color: var(--accent); }
        .stat-card.count .value { color: var(--success); }
        .stat-card .sub { font-size: .7rem; color: var(--text-muted); margin-top: 3px; }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 24px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
        }
        .section-title svg { color: var(--text-muted); flex-shrink: 0; }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .chart-container { position: relative; height: 220px; }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 10px;
            font-size: .8rem;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .legend-dot.morning { background: var(--morning); box-shadow: 0 0 10px var(--morning); }
        .legend-dot.night { background: var(--night); box-shadow: 0 0 10px var(--night); }

        .entry-list { display: flex; flex-direction: column; gap: 10px; }
        .entry-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all .2s;
            position: relative;
            overflow: hidden;
        }
        .entry-card:active { transform: scale(.98); background: var(--surface-2); }
        .entry-card .date-section { flex-shrink: 0; text-align: center; min-width: 48px; }
        .entry-card .day-num { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .entry-card .day-name {
            font-size: .65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 600;
            margin-top: -2px;
        }
        .entry-card .weights { flex: 1; display: flex; gap: 16px; }
        .entry-card .weight-block { text-align: center; flex: 1; }
        .entry-card .weight-block .time-label {
            font-size: .6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .entry-card .weight-block .weight-val { font-size: 1.15rem; font-weight: 700; }
        .entry-card .weight-block.morning .weight-val { color: var(--morning); }
        .entry-card .weight-block.night .weight-val { color: var(--night); }
        .entry-card .diff-section { text-align: right; min-width: 50px; }
        .entry-card .diff-val { font-size: .9rem; font-weight: 700; }
        .entry-card .diff-val.positive { color: var(--danger); }
        .entry-card .diff-val.negative { color: var(--success); }
        .entry-card .diff-val.neutral { color: var(--text-muted); }
        .entry-card .diff-label { font-size: .6rem; color: var(--text-muted); margin-top: 1px; }
        .entry-card .actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity .2s;
        }
        .entry-card:hover .actions, .entry-card:active .actions { opacity: 1; }
        @media (hover: none) {
            .entry-card .actions { opacity: 1; top: 6px; right: 6px; }
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s;
        }
        .btn-icon svg { width: 14px; height: 14px; }
        .btn-icon.edit { background: rgba(34,211,238,.1); color: var(--accent); }
        .btn-icon.edit:active { background: rgba(34,211,238,.2); }
        .btn-icon.delete { background: rgba(248,113,113,.1); color: var(--danger); }
        .btn-icon.delete:active { background: rgba(248,113,113,.2); }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state svg { width: 52px; height: 52px; margin-bottom: 14px; opacity: .25; }

        .fab {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            border: none;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(34,211,238,.35);
            cursor: pointer;
            z-index: 100;
            transition: all .25s cubic-bezier(.34,1.56,.64,1);
        }
        .fab:active { transform: translateX(-50%) scale(.9); }
        .fab svg { width: 28px; height: 28px; }

        .bottom-sheet {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .bottom-sheet.show { display: flex; }
        .bottom-sheet .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity .3s;
        }
        .bottom-sheet.show .overlay { opacity: 1; }
        .sheet-content {
            position: relative;
            background: var(--surface-2);
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 480px;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.34,1.56,.64,1);
            border-top: 1px solid var(--border);
        }
        .bottom-sheet.show .sheet-content { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 20px; }
        .sheet-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: .8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: .3px;
        }
        .form-group input {
            width: 100%;
            background: var(--surface-3);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
            color: var(--text);
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            transition: all .2s;
            -webkit-appearance: none;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34,211,238,.15);
        }
        .form-group input::placeholder { color: #475569; }
        .form-group input[type="date"] { color-scheme: dark; }

        .sheet-actions { display: flex; gap: 10px; margin-top: 8px; }
        .sheet-actions .btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all .2s;
        }
        .sheet-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: #0f172a;
        }
        .sheet-actions .btn-primary:active { transform: scale(.97); }
        .sheet-actions .btn-secondary {
            background: var(--surface-3);
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .sheet-actions .btn-secondary:active { background: var(--surface); }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--success);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: .9rem;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
            opacity: 0;
            transition: all .4s cubic-bezier(.34,1.56,.64,1);
            z-index: 300;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: var(--danger); color: #fff; }

        .streak-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(251,191,36,.1);
            color: var(--morning);
            font-size: .7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid rgba(251,191,36,.15);
        }
        .trend-mini { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }
        .trend-mini.up { color: var(--danger); }
        .trend-mini.down { color: var(--success); }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Weight Tracker</h1>
            <p>Log morning & night, every day</p>
        </header>

        <div class="stats-scroll">
            <div class="stat-card morning">
                <div class="label">Avg Morning</div>
                <div class="value" id="avgMorning">--</div>
                <div class="trend-mini" id="avgMorningSub"></div>
            </div>
            <div class="stat-card night">
                <div class="label">Avg Night</div>
                <div class="value" id="avgNight">--</div>
                <div class="trend-mini" id="avgNightSub"></div>
            </div>
            <div class="stat-card diff">
                <div class="label">Avg Diff</div>
                <div class="value" id="avgDiff">--</div>
                <div class="trend-mini" id="avgDiffSub"></div>
            </div>
            <div class="stat-card count">
                <div class="label">Entries</div>
                <div class="value" id="entryCount">0</div>
                <div id="streakDisplay"></div>
            </div>
        </div>

        <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            Trend
        </div>
        <div class="chart-card">
            <div class="legend">
                <div class="legend-item"><div class="legend-dot morning"></div><span>Morning</span></div>
                <div class="legend-item"><div class="legend-dot night"></div><span>Night</span></div>
            </div>
            <div class="chart-container"><canvas id="weightChart"></canvas></div>
        </div>

        <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            History
        </div>
        <div class="entry-list" id="historyList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 14l2 2 4-4"/></svg>
                <p>No entries yet.<br>Tap + to add your first weight!</p>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openSheet()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <div class="bottom-sheet" id="bottomSheet" onclick="closeSheetOnOverlay(event)">
        <div class="overlay"></div>
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title" id="sheetTitle">Add Entry</div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="morning">Morning (after washroom)</label>
                <input type="number" id="morning" step="0.1" placeholder="e.g. 72.5" required inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="night">Night (before bed)</label>
                <input type="number" id="night" step="0.1" placeholder="e.g. 73.2" required inputmode="decimal">
            </div>
            <div class="sheet-actions">
                <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
                <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">Add</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'weight_tracker_data';
        let entries = [], editingId = null, chart = null;
        document.getElementById('date').valueAsDate = new Date();

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) { try { entries = JSON.parse(raw); } catch(e) { entries = []; } }
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        }
        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        function openSheet() {
            document.getElementById('bottomSheet').classList.add('show');
            setTimeout(() => document.getElementById('morning').focus(), 350);
        }
        function closeSheet() {
            document.getElementById('bottomSheet').classList.remove('show');
            setTimeout(() => {
                editingId = null;
                document.getElementById('sheetTitle').textContent = 'Add Entry';
                document.getElementById('submitBtn').textContent = 'Add';
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('morning').value = '';
                document.getElementById('night').value = '';
            }, 300);
        }
        function closeSheetOnOverlay(e) { if (e.target.classList.contains('overlay')) closeSheet(); }

        function getStreak() {
            if (entries.length === 0) return 0;
            const dates = entries.map(e => e.date).sort();
            let streak = 1;
            for (let i = dates.length - 1; i > 0; i--) {
                const c = new Date(dates[i] + 'T00:00:00');
                const p = new Date(dates[i - 1] + 'T00:00:00');
                if ((c - p) / (1000 * 60 * 60 * 24) === 1) streak++; else break;
            }
            return streak;
        }
        function getTrend() {
            if (entries.length < 2) return null;
            const l = entries[entries.length - 1], p = entries[entries.length - 2];
            return { morning: l.morning - p.morning, night: l.night - p.night };
        }

        function handleSubmit() {
            const d = document.getElementById('date').value;
            const m = parseFloat(document.getElementById('morning').value);
            const n = parseFloat(document.getElementById('night').value);
            if (!d || isNaN(m) || isNaN(n)) { showToast('Fill all fields', true); return; }

            if (editingId) {
                const i = entries.findIndex(e => e.id === editingId);
                if (i !== -1) { entries[i] = { id: editingId, date: d, morning: m, night: n }; showToast('Updated!'); }
                editingId = null;
            } else {
                const ex = entries.findIndex(e => e.date === d);
                if (ex !== -1) {
                    if (!confirm('Entry exists for this date. Overwrite?')) return;
                    entries[ex] = { id: entries[ex].id, date: d, morning: m, night: n };
                    showToast('Updated!');
                } else {
                    entries.push({ id: Date.now(), date: d, morning: m, night: n });
                    showToast('Added!');
                }
            }
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveData(); renderAll(); closeSheet();
        }

        function editEntry(id) {
            const e = entries.find(x => x.id === id);
            if (!e) return;
            document.getElementById('date').value = e.date;
            document.getElementById('morning').value = e.morning;
            document.getElementById('night').value = e.night;
            editingId = id;
            document.getElementById('sheetTitle').textContent = 'Edit Entry';
            document.getElementById('submitBtn').textContent = 'Update';
            openSheet();
        }
        function deleteEntry(id) {
            if (!confirm('Delete this entry?')) return;
            entries = entries.filter(e => e.id !== id);
            saveData(); renderAll(); showToast('Deleted');
        }

        function updateStats() {
            if (entries.length === 0) {
                document.getElementById('avgMorning').textContent = '--';
                document.getElementById('avgNight').textContent = '--';
                document.getElementById('avgDiff').textContent = '--';
                document.getElementById('entryCount').textContent = '0';
                ['avgMorningSub','avgNightSub','avgDiffSub','streakDisplay'].forEach(id => document.getElementById(id).textContent = '');
                return;
            }
            const avgM = entries.reduce((s, e) => s + e.morning, 0) / entries.length;
            const avgN = entries.reduce((s, e) => s + e.night, 0) / entries.length;
            const avgD = avgN - avgM;
            document.getElementById('avgMorning').textContent = avgM.toFixed(1);
            document.getElementById('avgNight').textContent = avgN.toFixed(1);
            document.getElementById('avgDiff').textContent = (avgD >= 0 ? '+' : '') + avgD.toFixed(1);
            document.getElementById('entryCount').textContent = entries.length;

            const streak = getStreak();
            document.getElementById('streakDisplay').innerHTML = streak > 1
                ? `<span class="streak-pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>${streak} day streak</span>`
                : '';

            const t = getTrend();
            if (t) {
                document.getElementById('avgMorningSub').innerHTML = t.morning > 0
                    ? `<span class="trend-mini up">&#9650; +${t.morning.toFixed(1)}</span>`
                    : t.morning < 0 ? `<span class="trend-mini down">&#9660; ${t.morning.toFixed(1)}</span>` : '<span class="trend-mini">No change</span>';
                document.getElementById('avgNightSub').innerHTML = t.night > 0
                    ? `<span class="trend-mini up">&#9650; +${t.night.toFixed(1)}</span>`
                    : t.night < 0 ? `<span class="trend-mini down">&#9660; ${t.night.toFixed(1)}</span>` : '<span class="trend-mini">No change</span>';
                document.getElementById('avgDiffSub').textContent = 'vs last';
            } else {
                document.getElementById('avgMorningSub').textContent = '';
                document.getElementById('avgNightSub').textContent = '';
                document.getElementById('avgDiffSub').textContent = '';
            }
        }

        function renderHistory() {
            const c = document.getElementById('historyList');
            if (entries.length === 0) {
                c.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 14l2 2 4-4"/></svg><p>No entries yet.<br>Tap + to add your first weight!</p></div>`;
                return;
            }
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            c.innerHTML = [...entries].reverse().map(e => {
                const d = new Date(e.date + 'T00:00:00');
                const diff = e.night - e.morning;
                const dc = diff > 0 ? 'positive' : diff < 0 ? 'negative' : 'neutral';
                const ds = diff > 0 ? '+' : '';
                return `<div class="entry-card">
                    <div class="date-section"><div class="day-num">${d.getDate()}</div><div class="day-name">${days[d.getDay()]}</div></div>
                    <div class="weights">
                        <div class="weight-block morning"><div class="time-label">Morning</div><div class="weight-val">${e.morning.toFixed(1)}</div></div>
                        <div class="weight-block night"><div class="time-label">Night</div><div class="weight-val">${e.night.toFixed(1)}</div></div>
                    </div>
                    <div class="diff-section"><div class="diff-val ${dc}">${ds}${diff.toFixed(1)}</div><div class="diff-label">kg diff</div></div>
                    <div class="actions">
                        <button class="btn-icon edit" onclick="event.stopPropagation();editEntry(${e.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                        <button class="btn-icon delete" onclick="event.stopPropagation();deleteEntry(${e.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            if (chart) chart.destroy();
            if (entries.length === 0) return;
            const labels = entries.map(e => {
                const d = new Date(e.date + 'T00:00:00');
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Morning', data: entries.map(e => e.morning), borderColor: '#fbbf24',
                            backgroundColor: (ctx) => { const c = ctx.chart.ctx; const g = c.createLinearGradient(0,0,0,220); g.addColorStop(0,'rgba(251,191,36,.12)'); g.addColorStop(1,'rgba(251,191,36,0)'); return g; },
                            borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#fbbf24', pointBorderColor: '#0c0f1a', pointBorderWidth: 3, pointHoverRadius: 6, tension: .4, fill: true
                        },
                        {
                            label: 'Night', data: entries.map(e => e.night), borderColor: '#a78bfa',
                            backgroundColor: (ctx) => { const c = ctx.chart.ctx; const g = c.createLinearGradient(0,0,0,220); g.addColorStop(0,'rgba(167,139,250,.12)'); g.addColorStop(1,'rgba(167,139,250,0)'); return g; },
                            borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#a78bfa', pointBorderColor: '#0c0f1a', pointBorderWidth: 3, pointHoverRadius: 6, tension: .4, fill: true
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(12,15,26,.95)', titleColor: '#f1f5f9', bodyColor: '#f1f5f9', borderColor: 'rgba(255,255,255,.08)', borderWidth: 1, padding: 12, cornerRadius: 14, displayColors: true, titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 }, callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toFixed(1) + ' kg' } }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,.03)', drawBorder: false }, ticks: { color: '#64748b', font: { size: 10, family: 'Inter' }, maxRotation: 45, minRotation: 45 } },
                        y: { grid: { color: 'rgba(255,255,255,.03)', drawBorder: false }, ticks: { color: '#64748b', font: { size: 10, family: 'Inter' } } }
                    }
                }
            });
        }

        function renderAll() { updateStats(); renderHistory(); renderChart(); }
        document.querySelectorAll('input').forEach(i => { i.addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmit(); }); });
        loadData(); renderAll();
    </script>
</body>
</html>
