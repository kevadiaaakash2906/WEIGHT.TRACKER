<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Weight Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Connecting...</div>
    </div>

    <div class="app">
        <header>
            <h1>Weight Tracker</h1>
            <p>Log morning & night, every day</p>
            <div class="header-actions">
                <button class="btn-icon" onclick="openSettingsSheet()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.67 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.67a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <div class="sync-bar" id="syncBar">
            <div class="sync-dot"></div>
            <span id="syncText">Syncing...</span>
        </div>

        <div class="stats-scroll">
            <div class="stat-card morning">
                <div class="label">Avg Morning</div>
                <div class="value" id="avgMorning">--</div>
                <div class="trend-mini" id="avgMorningSub"></div>
            </div>
            <div class="stat-card night">
                <div class="label">Avg Night</div>
                <div class="value" id="avgNight">--</div>
                <div class="trend-mini" id="avgNightSub"></div>
            </div>
            <div class="stat-card diff">
                <div class="label">Avg Diff</div>
                <div class="value" id="avgDiff">--</div>
                <div class="trend-mini" id="avgDiffSub"></div>
            </div>
            <div class="stat-card bmi">
                <div class="label">BMI</div>
                <div class="value" id="bmiValue">--</div>
                <div id="bmiCategory"></div>
            </div>
            <div class="stat-card goal">
                <div class="label">Goal</div>
                <div class="value" id="goalValue">--</div>
                <div class="goal-progress-bar"><div class="goal-progress-fill" id="goalProgress" style="width:0%"></div></div>
                <div class="goal-days" id="goalDays">Set a goal</div>
            </div>
            <div class="stat-card count">
                <div class="label">Entries</div>
                <div class="value" id="entryCount">0</div>
                <div id="streakDisplay"></div>
            </div>
        </div>

        <div id="weeklySummary"></div>

        <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            Trend
        </div>
        <div class="filter-pills">
            <button class="filter-pill active" data-filter="all" onclick="handleFilterClick('all')">All</button>
            <button class="filter-pill" data-filter="7d" onclick="handleFilterClick('7d')">7D</button>
            <button class="filter-pill" data-filter="30d" onclick="handleFilterClick('30d')">30D</button>
            <button class="filter-pill" data-filter="90d" onclick="handleFilterClick('90d')">90D</button>
        </div>
        <div class="chart-card">
            <div class="legend">
                <div class="legend-item"><div class="legend-dot morning"></div><span>Morning</span></div>
                <div class="legend-item"><div class="legend-dot night"></div><span>Night</span></div>
            </div>
            <div class="chart-container"><canvas id="weightChart"></canvas></div>
        </div>

        <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            History
        </div>
        <div class="entry-list" id="historyList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 14l2 2 4-4"/></svg>
                <p>No entries yet.<br>Tap + to add your first weight!</p>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openAddSheet()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Add/Edit Sheet -->
    <div class="bottom-sheet" id="bottomSheet" onclick="closeSheetOnOverlay(event)">
        <div class="overlay"></div>
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title" id="sheetTitle">Add Entry</div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Time of Day</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="toggleMorning" onclick="setTimeOfDay('morning')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        Morning
                    </button>
                    <button class="toggle-btn" id="toggleNight" onclick="setTimeOfDay('night')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        Night
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="weight" id="weightLabel">Weight (Morning) (kg)</label>
                <input type="number" id="weight" step="0.1" placeholder="e.g. 72.5" required inputmode="decimal">
            </div>
            <div class="sheet-actions">
                <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
                <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">Add</button>
            </div>
        </div>
    </div>

    <!-- Settings Sheet -->
    <div class="bottom-sheet" id="settingsSheet" onclick="closeSheetOnOverlay(event, 'settingsSheet')">
        <div class="overlay"></div>
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title">Settings</div>
            <div class="form-group">
                <label for="settingHeight">Height (cm)</label>
                <input type="number" id="settingHeight" step="0.1" placeholder="e.g. 175" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="settingGoal">Goal Weight (kg)</label>
                <input type="number" id="settingGoal" step="0.1" placeholder="e.g. 70" inputmode="decimal">
            </div>
            <div class="sheet-actions">
                <button class="btn btn-secondary" onclick="closeSheet('settingsSheet')">Cancel</button>
                <button class="btn btn-primary" onclick="handleSettingsSave()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
